name: filipino_learn
description: "Gamified Filipino language learning app (student, teacher CMS, parent dashboard)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.0

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Speech & audio
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Charts for progress dashboards
  fl_chart: ^0.69.2

  # Utilities
  equatable: ^2.0.7
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
